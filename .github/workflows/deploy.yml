# Test, build and deploy to shared hosting over SSH on every push to production.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   SSH_HOST, SSH_PORT, SSH_USER
#   SSH_KEY          private key of a deploy-only key pair (public half goes in the host's authorized keys)
#   SSH_KNOWN_HOSTS  output of: ssh-keyscan -p <port> <host>
# Optional repository variables (same page -> Variables):
#   DEPLOY_PATH  app directory, relative to the SSH user's home (default: portfolio)
#   PHP_BIN      PHP 8.2+ CLI on the host (default: php)
#
# One-time server setup is in README.md -> Deployment -> GitHub Actions.

name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portfolio_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'portfolio' }}
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}

    steps:
      - uses: actions/checkout@v4

      # Lowest PHP the app supports, so vendor/ runs on any 8.2+ host.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, intl, gd, zip
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build assets
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Test
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: Production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Upload
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH="ssh -p $SSH_PORT -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          # rsync --delete below wipes anything not in the build: only allow a
          # missing/empty directory or one that already holds this app.
          $SSH "$SSH_USER@$SSH_HOST" \
            "test ! -e '$DEPLOY_PATH' || test -f '$DEPLOY_PATH/artisan' || test -z \"\$(ls -A '$DEPLOY_PATH')\"" \
            || { echo "::error::$DEPLOY_PATH exists on the server and is not this app; refusing to deploy over it."; exit 1; }
          rsync -az --delete -e "$SSH" \
            --exclude=/.git --exclude=/.github --exclude=/node_modules --exclude=/tests \
            --exclude=/.env --exclude=/.phpunit.result.cache \
            --exclude=/storage --exclude=/public/storage \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Migrate and cache
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && PHP='$PHP_BIN' bash -s" <<'EOF'
          set -e
          test -f .env || { echo "Missing .env on the server: create it in $(pwd) first (see README)."; exit 1; }
          mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions \
                   storage/framework/views storage/logs bootstrap/cache
          # Shell symlink: works even where PHP's symlink() is disabled (common on shared hosts).
          ln -sfn ../storage/app/public public/storage
          $PHP artisan migrate --force
          $PHP artisan optimize
          EOF
