  <text x="70" y="180" font-family="system-ui,sans-serif" font-weight="900" font-size="58" letter-spacing="-3" fill="url(#t)">Rivera</text>
  <rect x="34" y="198" width="190" height="9" rx="4" fill="#22111f"/>
  <rect x="34" y="216" width="74" height="22" rx="11" fill="#c2185b"/>
  <rect x="116" y="216" width="74" height="22" rx="11" fill="none" stroke="#22111f" stroke-width="2"/>
