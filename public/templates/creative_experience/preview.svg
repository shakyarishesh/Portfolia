<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Creative Experience template: big expressive name over a particle canvas hero, with a project showcase below">
  <defs>
    <radialGradient id="g1" cx="80%" cy="10%" r="55%"><stop offset="0" stop-color="#c2185b" stop-opacity=".55"/><stop offset="1" stop-color="#c2185b" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="5%" cy="95%" r="45%"><stop offset="0" stop-color="#c2410c" stop-opacity=".45"/><stop offset="1" stop-color="#c2410c" stop-opacity="0"/></radialGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#c2185b"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2185b"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
