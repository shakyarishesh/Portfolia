  <g stroke="#22111f" stroke-opacity=".2"><path d="M420 80 470 110 520 90 560 140 500 170 450 150 420 80M470 110 450 150M520 90 500 170M330 200 380 180 420 210"/></g>
  <g fill="#c2185b"><circle cx="420" cy="80" r="4"/><circle cx="520" cy="90" r="3"/><circle cx="500" cy="170" r="4"/><circle cx="380" cy="180" r="3"/><circle cx="600" cy="70" r="3"/></g>
  <g fill="#c2410c"><circle cx="470" cy="110" r="3"/><circle cx="560" cy="140" r="4"/><circle cx="450" cy="150" r="3"/><circle cx="330" cy="200" r="3"/><circle cx="420" cy="210" r="4"/></g>
